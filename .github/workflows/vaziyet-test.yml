name: Vaziyet planı testi

# vaziyet-plani.html'i Safari (WebKit, Mac) ve Chrome'da Retina ve telefon boyutunda açar;
# gündüz/gece, sahne geçişi, pencere değişimi ve ekran kartı bağlamı düşmesinden sonra
# 360° görüntünün kaymadığını denetler. Ayrıntı: .github/scripts/vaziyet_test.js
# Her değişiklikte depodaki dosyayı, her sabah 07:30 TR canlı siteyi test eder; hata olursa GitHub e-posta atar.
on:
  push:
    branches: [main, "claude/**"]
    paths: ["vaziyet-plani.html", "assets/vendor/pannellum/**", ".github/scripts/vaziyet_test.js", ".github/workflows/vaziyet-test.yml"]
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Playwright kur
        run: |
          npm i --no-save playwright@1.56.1
          npx playwright install webkit chromium
      - name: Test (değişiklikte depodaki dosya, zamanlıda canlı site)
        run: |
          mkdir -p shots
          if [ "${{ github.event_name }}" = "schedule" ]; then
            URL="https://yenifikirtepeburada.com/vaziyet-plani.html"
          else
            python3 -m http.server 8811 >/dev/null 2>&1 &
            sleep 2
            URL="http://localhost:8811/vaziyet-plani.html"
          fi
          SHOTS=shots node .github/scripts/vaziyet_test.js "$URL" chromium,webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ekran-goruntuleri
          path: shots
