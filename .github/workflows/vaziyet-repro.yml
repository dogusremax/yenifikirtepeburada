name: Vaziyet planı gerçek Safari denemesi

# Gerçek Safari'de (Mac, ekranlı) pencere değiştirme senaryosunu çalıştırıp ekran görüntüsü alır.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/scripts/vaziyet_ff.js", ".github/scripts/vaziyet_repro.py", ".github/scripts/vaziyet_karsilastir.js", ".github/workflows/vaziyet-repro.yml", "vaziyet-plani.html"]
  workflow_dispatch:

jobs:
  safari:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Hazırlık
        run: |
          sudo safaridriver --enable
          pip3 install --break-system-packages selenium || pip3 install selenium
          system_profiler SPDisplaysDataType | head -30
      - name: Firefox ekranlı pencere değiştirme
        continue-on-error: true
        run: |
          npm i --no-save playwright@1.56.1 && npx playwright install firefox
          mkdir -p shots/ff
          node .github/scripts/vaziyet_ff.js "https://yenifikirtepeburada.com/vaziyet-plani.html" shots/ff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-deneme
          path: shots
