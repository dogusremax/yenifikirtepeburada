name: Vaziyet planı gerçek Safari denemesi

# Gerçek Safari'de (Mac, ekranlı) pencere değiştirme senaryosunu çalıştırıp ekran görüntüsü alır.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/scripts/vaziyet_repro.py", ".github/workflows/vaziyet-repro.yml", "vaziyet-plani.html"]
  workflow_dispatch:

jobs:
  safari:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Hazırlık
        run: |
          sudo safaridriver --enable
          pip3 install --break-system-packages selenium || pip3 install selenium
          system_profiler SPDisplaysDataType | head -30
      - name: Canlı site
        continue-on-error: true
        run: python3 .github/scripts/vaziyet_repro.py "https://yenifikirtepeburada.com/vaziyet-plani.html" shots/canli
      - name: Depodaki sürüm
        continue-on-error: true
        run: |
          python3 -m http.server 8811 >/dev/null 2>&1 &
          sleep 2
          python3 .github/scripts/vaziyet_repro.py "http://localhost:8811/vaziyet-plani.html" shots/depo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safari-deneme
          path: shots
