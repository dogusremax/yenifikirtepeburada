name: Teslim takvimi

# Emlak Konut "Teslim İşlemleri" sayfasındaki Yeni Fikirtepe teslim programlarını
# (PDF) okur, teslim-takvimi.json'u günceller. teslim-takvimi.html bu dosyayı okur.
# Yeni etap eklenirse ya da program değişirse site kendiliğinden güncellenir.
# Saatler UTC: 04:15, 09:15, 14:15 = TR 07:15, 12:15, 17:15.
on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "15 9 * * *"
    - cron: "15 14 * * *"
  workflow_dispatch:
  push:
    branches: [claude/etap-teslim-tarihleri-anoaws]
    paths: [scripts/teslim_guncelle.py, .github/workflows/teslim.yml]

permissions:
  contents: write

concurrency:
  group: teslim
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: pdftotext kur
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)

      - name: Emlak Konut programlarını oku
        id: oku
        run: |
          set +e
          python3 scripts/teslim_guncelle.py teslim-takvimi.json
          echo "kod=$?" >> "$GITHUB_OUTPUT"

      - name: Kaydet
        run: |
          if git diff --quiet -- teslim-takvimi.json 2>/dev/null && git ls-files --error-unmatch teslim-takvimi.json >/dev/null 2>&1; then
            echo "Değişiklik yok"; exit 0
          fi
          [ -f teslim-takvimi.json ] || { echo "Dosya üretilemedi"; exit 0; }
          git config user.name "dogusremax"
          git config user.email "dogusremax@gmail.com"
          git add teslim-takvimi.json
          git commit -m "Teslim takvimi: Emlak Konut programı güncellendi ($(TZ=Europe/Istanbul date +%F))"
          git pull --rebase -q origin "$GITHUB_REF_NAME"
          git push origin HEAD:"$GITHUB_REF_NAME"

      - name: Okunamayan program var mı
        if: steps.oku.outputs.kod != '0'
        run: |
          echo "::warning::En az bir teslim programı okunamadı; eski veri korunuyor. Ayrıntı 'Emlak Konut programlarını oku' adımında."
          exit 1
