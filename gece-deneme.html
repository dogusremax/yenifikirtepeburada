<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><title>Gece 360° Deneme · Yeni Fikirtepe</title>
<style>
/* Tam ekran 360° görüntü, altta tek gündüz/gece anahtarı */
:root{--bg:#0b1020;--fg:#f3f5fb;--chip:rgba(12,16,32,.72);--line:rgba(255,255,255,.18);--on:#f4b860;--onfg:#1b1206;
--font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden}
#v{position:fixed;inset:0;touch-action:none;cursor:grab}
#v:active{cursor:grabbing}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--chip);border:1px solid var(--line);backdrop-filter:blur(8px)}
.bar button{font:600 14px/1 var(--font);letter-spacing:.02em;color:var(--fg);background:none;border:0;border-radius:999px;padding:11px 20px;cursor:pointer}
.bar button[aria-pressed="true"]{background:var(--on);color:var(--onfg)}
.bar button:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.scn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;padding:4px;border-radius:999px;background:var(--chip);border:1px solid var(--line);backdrop-filter:blur(8px)}
.scn button{font:600 14px/1 var(--font);color:var(--fg);background:none;border:0;border-radius:999px;width:38px;height:38px;cursor:pointer}
.scn button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
.scn button:focus-visible{outline:2px solid var(--on);outline-offset:2px}
.hint{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;right:16px;text-align:center;font:500 13px/1.4 var(--font);opacity:.85;pointer-events:none;transition:opacity .6s}
.hint.off{opacity:0}
#load{position:fixed;inset:0;display:grid;place-items:center;font:500 14px var(--font);pointer-events:none}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&display=swap">
</head><body>
<div id="v"></div>
<div id="load">Yükleniyor…</div>
<nav class="scn" id="scn" aria-label="Sahneler"></nav>
<div class="hint" id="hint">Sürükleyerek çevirin, iki parmakla yakınlaştırın</div>
<div class="bar" role="group" aria-label="Gündüz ve gece">
  <button id="bd" type="button" aria-pressed="false">Gündüz</button>
  <button id="bn" type="button" aria-pressed="true">Gece</button>
</div>
<script>
(function(){
  var el=document.getElementById('v'),cv=document.createElement('canvas');el.appendChild(cv);
  var gl=cv.getContext('webgl',{antialias:false});
  if(!gl){document.getElementById('load').textContent='Bu tarayıcı 360° görüntüyü açamıyor.';return;}
  var sz=(gl.getParameter(gl.MAX_TEXTURE_SIZE)>=8192&&Math.min(screen.width,screen.height)>=700)?'8k':'4k'; // telefonda 4k: bellek
  function sh(t,src){var s=gl.createShader(t);gl.shaderSource(s,src);gl.compileShader(s);return s;}
  var pr=gl.createProgram();
  gl.attachShader(pr,sh(gl.VERTEX_SHADER,'attribute vec2 p;varying vec2 q;void main(){q=p;gl_Position=vec4(p,0.,1.);}'));
  gl.attachShader(pr,sh(gl.FRAGMENT_SHADER,'precision highp float;varying vec2 q;uniform sampler2D A,B,C;uniform float m,yaw,pit,tf,asp,tm;'+
    'void main(){vec3 d=normalize(vec3(q.x*tf*asp,q.y*tf,1.));float c=cos(pit),s=sin(pit);d=vec3(d.x,d.y*c+d.z*s,-d.y*s+d.z*c);'+
    'float cy=cos(yaw),sy=sin(yaw);d=vec3(d.x*cy+d.z*sy,d.y,-d.x*sy+d.z*cy);'+
    'vec2 uv=vec2(atan(d.x,d.z)/6.2831853+.5,.5-asin(clamp(d.y,-1.,1.))/3.1415927);'+
    'vec3 col=mix(texture2D(A,uv),texture2D(B,uv),m).rgb;vec3 t=texture2D(C,uv).rgb;'+
    // akan trafik: C dokusu b=yol maskesi, r,g=yol yönü (2θ kodlu); her şeritte ışık kesikleri yol boyunca kayar
    'if(t.b>.02&&m>.01){float a=.5*atan(t.g*2.-1.,t.r*2.-1.);vec2 dr=vec2(cos(a),sin(a));vec2 p=uv*vec2(4096.,2048.);'+
    'float l=floor(dot(p,vec2(-dr.y,dr.x))/3.);float h=fract(sin(l*12.9898)*43758.545);float sg=h>.5?1.:-1.;'+
    'float ph=fract(dot(p,dr)/(26.+h*20.)+sg*tm*(.9+h*.7)+h*9.);float pu=smoothstep(0.,.08,ph)*(1.-smoothstep(.08,.35,ph));'+
    'col+=smoothstep(.02,.35,t.b)*pu*m*1.3*(sg>0.?vec3(1.,.92,.78):vec3(1.,.32,.18));}'+
    'gl_FragColor=vec4(col,1.);}'));
  gl.linkProgram(pr);gl.useProgram(pr);
  var bf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,bf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var lp=gl.getAttribLocation(pr,'p');gl.enableVertexAttribArray(lp);gl.vertexAttribPointer(lp,2,gl.FLOAT,false,0,0);
  var U={};['A','B','C','m','yaw','pit','tf','asp','tm'].forEach(function(k){U[k]=gl.getUniformLocation(pr,k);});
  gl.uniform1i(U.A,0);gl.uniform1i(U.B,1);gl.uniform1i(U.C,2);
  // sahneler: assets/vr/gece-deneme/sN/{gunduz,gece}-{4k,8k}.jpg
  var SCN=[1,2,3,4,5,6,7],cur=0,TRF=[],T=[0,1,2].map(function(unit){var t=gl.createTexture();gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,t);
    gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array(unit<2?[11,16,32]:[128,128,0]));
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.REPEAT);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;});
  function scene(i){cur=i;var k=SCN[i],n=0,ld=document.getElementById('load');ld.textContent='Yükleniyor…';ld.hidden=false;
    document.querySelectorAll('.scn button').forEach(function(b,j){b.setAttribute('aria-pressed',j===i);});
    ['gunduz','gece'].forEach(function(f,unit){var im=new Image();
      im.onload=function(){if(cur!==i)return;gl.activeTexture(gl.TEXTURE0+unit);gl.bindTexture(gl.TEXTURE_2D,T[unit]);
        gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,im);if(++n===2)ld.hidden=true;};
      im.onerror=function(){ld.textContent='Görüntü yüklenemedi.';};im.src='assets/vr/gece-deneme/s'+k+'/'+f+'-'+sz+'.jpg';});
    gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,T[2]);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,1,1,0,gl.RGB,gl.UNSIGNED_BYTE,new Uint8Array([128,128,0]));
    if(TRF.indexOf(k)>=0){var tr=new Image();tr.onload=function(){if(cur!==i)return;gl.activeTexture(gl.TEXTURE2);gl.bindTexture(gl.TEXTURE_2D,T[2]);
      gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGB,gl.RGB,gl.UNSIGNED_BYTE,tr);};tr.src='assets/vr/gece-deneme/s'+k+'/trafik.png';}}
  var nav=document.getElementById('scn');SCN.forEach(function(k,i){var b=document.createElement('button');b.type='button';b.textContent=k;
    b.setAttribute('aria-label','Sahne '+k);b.onclick=function(){scene(i);};nav.appendChild(b);});
  scene(0);
  var isNight=true,mix=1,lon=0,lat=-24,fov=75;
  function set(v){isNight=v;document.getElementById('bn').setAttribute('aria-pressed',v);document.getElementById('bd').setAttribute('aria-pressed',!v);}
  document.getElementById('bn').onclick=function(){set(true)};document.getElementById('bd').onclick=function(){set(false)};
  var ptr={},d0=0,x0,y0,lon0,lat0;
  function grab(){var k=Object.keys(ptr);if(k.length){var p=ptr[k[0]];x0=p.clientX;y0=p.clientY;lon0=lon;lat0=lat;}}
  el.addEventListener('pointerdown',function(e){ptr[e.pointerId]=e;el.setPointerCapture(e.pointerId);grab();document.getElementById('hint').classList.add('off');});
  el.addEventListener('pointermove',function(e){if(!ptr[e.pointerId])return;ptr[e.pointerId]=e;var k=Object.keys(ptr);
    if(k.length===2){var a=ptr[k[0]],b=ptr[k[1]],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);if(d0)fov=Math.max(25,Math.min(100,fov*d0/d));d0=d;return;}
    var s=fov/el.clientHeight;lon=lon0-(e.clientX-x0)*s;lat=Math.max(-88,Math.min(88,lat0+(e.clientY-y0)*s));});
  function up(e){delete ptr[e.pointerId];d0=0;grab();}
  el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);
  el.addEventListener('wheel',function(e){e.preventDefault();fov=Math.max(25,Math.min(100,fov+e.deltaY*.05));},{passive:false});
  setTimeout(function(){document.getElementById('hint').classList.add('off')},6000);
  var red=matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function tick(){requestAnimationFrame(tick);
    var dp=Math.min(devicePixelRatio||1,2),w=Math.round(innerWidth*dp),h=Math.round(innerHeight*dp);
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';gl.viewport(0,0,w,h);}
    mix+=((isNight?1:0)-mix)*(red?1:.12);
    gl.uniform1f(U.m,mix);gl.uniform1f(U.tm,(performance.now()/1000)%3600.);gl.uniform1f(U.yaw,lon*Math.PI/180);gl.uniform1f(U.pit,lat*Math.PI/180);
    gl.uniform1f(U.tf,Math.tan(fov*Math.PI/360));gl.uniform1f(U.asp,w/h);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);})();
})();
</script>
</body></html>
