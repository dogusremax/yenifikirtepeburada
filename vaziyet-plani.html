<style>
  :root{--navy:#050A30;--red:#DC1C2E;--coral:#FB5160;--ok:#1fb855;--ink:#0f1722;--gray:#5b6473;--line:#e6e9ef}

  /* üst şerit */

  .ttl{flex:1;min-width:0}
  .ttl b{display:block;font-size:15px;font-weight:800;letter-spacing:.2px}
  .ttl span{display:block;font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .logo{height:34px;width:auto;border-radius:8px;background:#fff;padding:4px 8px}

  /* etap pini: resmi VR'daki görünür konumla aynı olsun diye noktanın 20/25 px sağ altında durur */
  .pin{width:30px;height:30px;margin:0;border-radius:50%;background:var(--navy);color:#fff;
    border:2px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:13px;cursor:pointer;transition:background .15s,box-shadow .15s}
  .pin{border-color:var(--c,#fff)}
  .pin:hover,.pin.sel{box-shadow:0 0 0 4px rgba(220,28,46,.35),0 2px 10px rgba(0,0,0,.45);background:var(--red)}
  .pin span{pointer-events:none}
  /* sahne geçişi */
  .go{position:relative;width:44px;height:44px;border-radius:50%;cursor:pointer;
    background:var(--coral);border:3px solid #fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(0,0,0,.45)}
  .go::before{content:'';position:absolute;inset:-3px;border-radius:50%;border:3px solid #fff;animation:gop 1.8s ease-out 3;pointer-events:none}
  @keyframes gop{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.9);opacity:0}}
  .go svg{width:22px;height:22px;fill:#fff;pointer-events:none}
  .go b{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12px;font-weight:800;
    color:#fff;background:rgba(5,10,48,.82);padding:3px 9px;border-radius:999px;pointer-events:none;box-shadow:0 2px 8px rgba(0,0,0,.35)}
  .go:hover{background:var(--red)}

  /* alt sahne şeridi */
  .scenes{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:8px;overflow-x:auto;
    padding:22px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(5,10,48,0),rgba(5,10,48,.75));scrollbar-width:none}
  .scenes::-webkit-scrollbar{display:none}
  .sc{flex:0 0 auto;width:86px;border:0;padding:0;background:none;color:#fff;cursor:pointer;font:inherit;text-align:center}
  .sc img{display:block;width:86px;height:54px;object-fit:cover;border-radius:10px;border:2px solid rgba(255,255,255,.35)}
  .sc span{display:block;font-size:11px;font-weight:600;margin-top:4px;opacity:.85}
  .sc.on img{border-color:var(--red)}
  .sc.on span{opacity:1}
  @media (min-width:768px){.scenes{justify-content:center}}

  /* etap kartı: canlı vaziyet planındaki kartla aynı (sayaçlı) */
  :root{--soft:#f5f7fb}
  .card{position:fixed;z-index:10;left:50%;bottom:0;width:min(560px,100%);transform:translate(-50%,105%);background:#fff;color:var(--ink);
    border-radius:24px 24px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -20px 50px -20px rgba(5,10,48,.5);
    transition:transform .45s cubic-bezier(.2,.9,.25,1);max-height:62vh;overflow-y:auto}
  .card.on{transform:translate(-50%,0)}
  @media (min-width:768px){.card{left:auto;right:20px;bottom:auto;top:50%;width:340px;border-radius:24px;max-height:88vh;transform:translate(calc(100% + 40px),-50%)}.card.on{transform:translate(0,-50%)}}
  .card h3{margin:0}
  .sh{display:flex;align-items:center;gap:14px;padding-right:40px}
  .sh .n{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.4rem;font-weight:800;color:#fff;background:var(--navy);box-shadow:inset 0 -4px 0 var(--c)}
  .sh h3{font-size:1.3rem;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.2}
  .badge{display:inline-flex;align-items:center;gap:6px;margin-top:4px;font-size:.72rem;font-weight:800;letter-spacing:.06em;color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);padding:3px 9px;border-radius:999px}
  .badge i{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .badge.now i{animation:blink 1.2s 5}
  @keyframes blink{50%{opacity:.25}}
  .x{position:absolute;right:14px;top:14px;width:36px;height:36px;border-radius:50%;border:0;background:var(--soft);cursor:pointer;font-size:1.3rem;line-height:1;color:var(--navy)}
  .stl{margin:14px 0 4px;font-size:.95rem;color:#2c3543}
  .stl b{color:var(--navy)}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
  .tile{background:var(--soft);border-radius:14px;padding:12px}
  .tile b{display:block;font-size:1.35rem;font-weight:800;color:var(--navy);letter-spacing:-.02em;line-height:1.15;font-variant-numeric:tabular-nums}
  .tile.t b{font-size:1rem;line-height:1.5}
  .tile span{font-size:.74rem;color:var(--gray);font-weight:600}
  .prog{margin:6px 0 14px;background:var(--soft);border-radius:14px;padding:12px 14px}
  .prog .top{display:flex;justify-content:space-between;font-size:.82rem;font-weight:700;color:var(--navy);margin-bottom:8px}
  .prog .top span{color:var(--gray);font-weight:600}
  .prog .trk{height:10px;border-radius:9px;background:#e3e7ef;overflow:hidden}
  .prog .val{height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--red),var(--coral));transition:width 1.2s cubic-bezier(.2,.8,.2,1) .15s}
  .acts{display:grid;gap:8px}
  .acts a{display:flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;font-weight:700;font-size:.95rem;padding:14px;border-radius:14px;transition:transform .15s}
  .acts a:active{transform:scale(.98)}
  .acts .pri{background:var(--red);color:#fff;box-shadow:0 10px 20px -10px rgba(220,28,46,.7)}
  .acts .row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .acts .sec2{background:var(--soft);color:var(--navy)}
  .acts .wa{background:#e9f9ef;color:#128c4a}
  .acts svg{width:18px;height:18px;flex:none;fill:currentColor}
  /* küçük kart: görüntüyü kapatmasın */
  .card{padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-radius:18px 18px 0 0;max-height:none;overflow:visible}
  @media (min-width:768px){.card{width:280px;right:16px;border-radius:16px;top:auto;bottom:16px;transform:translateX(calc(100% + 40px))}.card.on{transform:none}}

  .sh{gap:8px;padding-right:34px}.sh .n{width:34px;height:34px;border-radius:10px;font-size:.95rem;box-shadow:inset 0 -3px 0 var(--c)}

  .badge{font-size:.6rem;padding:2px 7px;margin-top:2px}
  .stl{margin:6px 0 0;font-size:.74rem;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gray)}

  .tile{padding:5px 7px;border-radius:9px}
  .tile b{font-size:.92rem}.tile.t b{font-size:.74rem;line-height:1.5}
  .tile span{font-size:.6rem}
  .prog{margin:0 0 7px;padding:5px 8px;border-radius:9px}
  .prog .top{font-size:.66rem;margin-bottom:4px}
  .prog .trk{height:5px}
  .acts{grid-template-columns:1fr 1fr auto;gap:5px}
  .acts a{padding:8px 6px;font-size:.76rem;border-radius:9px;gap:5px}
  .acts .row{display:contents}
  .acts .wa{width:40px;padding:8px 0;font-size:0}
  .acts svg{width:16px;height:16px}
  /* en küçük kart: tek satır bilgi, ince butonlar */
  .card{padding:8px 10px calc(8px + env(safe-area-inset-bottom))}

  .card .x{top:6px;right:6px;width:24px;height:24px;font-size:1rem}
  .sh{gap:7px;padding-right:28px}.sh .n{width:28px;height:28px;border-radius:8px;font-size:.82rem}
  .sh>div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .sh h3{font-size:.88rem}
  .badge{margin-top:0}
  .stl,.prog{display:none}
  .tiles{display:flex;gap:10px;margin:5px 0 6px;align-items:baseline}
  .tile{background:none;padding:0;display:flex;align-items:baseline;gap:3px}
  .tile b{font-size:.85rem;display:inline}.tile.t b{font-size:.72rem}
  .tile span{font-size:.62rem}
  .acts a{padding:6px 5px;font-size:.7rem;border-radius:8px}
  .acts .wa{width:34px;padding:6px 0}
  .acts svg{width:14px;height:14px}
  body.carded .scenes{opacity:0;pointer-events:none}
  .scenes{transition:opacity .3s}
  .hint{position:fixed;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(5,10,48,.78);padding:10px 16px;border-radius:12px;

  .hint.off{opacity:0}
  .hlsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

  .card.pop{left:0;top:0;right:auto;bottom:auto;width:min(270px,calc(100vw - 24px));padding:8px 10px;border-radius:16px;

  .card.pop.on{transform:none;opacity:1;pointer-events:auto}
    /* gündüz / gece */
  .tgl{position:fixed;z-index:5;right:16px;top:calc(62px + env(safe-area-inset-top));display:flex;background:rgba(5,10,48,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
    border-radius:999px;padding:3px;border:0;cursor:pointer;font:inherit}
  .tgl::before{content:'';position:absolute;top:3px;bottom:3px;left:3px;width:calc(50% - 3px);border-radius:999px;background:#fff;box-shadow:0 2px 8px rgba(5,10,48,.25);transition:transform .5s cubic-bezier(.6,0,.2,1),background .5s}
  .tgl span{position:relative;z-index:1;padding:6px 11px;font-size:.76rem;font-weight:700;color:rgba(255,255,255,.8);transition:color .4s;display:flex;align-items:center;gap:5px}
  .tgl span.d{color:var(--navy)}
  .tgl svg{width:14px;height:14px}
  .night .tgl::before{transform:translateX(100%);background:var(--coral)}
  .night .tgl span.d{color:rgba(255,255,255,.8)}.night .tgl span.m{color:#fff}
  /* işaretleri gizle / göster */
  .pins{position:fixed;z-index:5;right:16px;top:calc(104px + env(safe-area-inset-top));display:flex;align-items:center;gap:6px;padding:7px 12px;border:0;border-radius:999px;
    background:rgba(5,10,48,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;font:inherit;font-size:.76rem;font-weight:700;cursor:pointer}
  .pins svg{width:15px;height:15px}.pins .off{display:none}
  .nopin .pins{background:var(--coral)}.nopin .pins .on{display:none}.nopin .pins .off{display:block}
  .nopin .pnlm-hotspot-base,.nopin .hlsvg{visibility:hidden!important}

    if(v.isLoaded())applyDZ();else{var o=function(){v.off('load',o);applyDZ();};v.on('load',o);}  // sahne yüklenmeden değiştirilirse eski numaralar kalıyor
  }).catch(function(){});
  function applyDZ(){
    SC.forEach(function(s,i){['','n'].forEach(function(nx){var id='s'+(i+1)+nx;
      s.e.forEach(function(e,q){try{v.removeHotSpot('e'+q,id);}catch(_){}});
      DZ.sc[i].pins.forEach(function(pn,q){if(!pn[2])return;v.addHotSpot({id:'e'+q,yaw:pn[0],pitch:pn[1],cssClass:'etaphs',createTooltipFunc:pinEl,createTooltipArgs:[pn[2]],
        clickHandlerFunc:function(){open(pn[2],pn[0],pn[1]);}},id);});});});
    prune();paint();
  }
  // sahne yüklenmeden düzen gelirse eski/çift numaralar ekranda kalabiliyor: geçerli sahnede olmayan numaraları sil
  function prune(){var c=v.getConfig(),keep=(c.hotSpots||[]).map(function(h){return h.div;});
    [].forEach.call(document.querySelectorAll('.etaphs'),function(d){if(keep.indexOf(d)<0&&d.parentNode)d.parentNode.removeChild(d);});
    if(sel)mark(sel);}
  v.on('load',prune);
  // Safari (Retina) gece/gündüz geçişinden sonra görüntüyü 2 kat büyütüp sol alt köşeden çizebiliyor, numaralar yerinde kalıyor:
  // tuval boyutu ekranla uyuşmazsa yeniden boyutlandır, WebGL görüş alanını tuvale eşitle.
  // Yalnız görüntü hareket ederken (sürükleme, yakınlaşma, sahne geçişi) çalışır; boşta döngü durur, bilgisayar yorulmaz.
  var VPT=0,VPON=false;
  function wake(){VPT=performance.now();if(!VPON){VPON=true;requestAnimationFrame(vpFix);}if(card.classList.contains('on'))loopOn();}
  ['mousedown','touchstart','wheel','keydown'].forEach(function(ev){addEventListener(ev,wake,{passive:true,capture:true});});
  addEventListener('mousemove',function(e){if(e.buttons)wake();},{passive:true});
  addEventListener('touchmove',wake,{passive:true});
  addEventListener('resize',wake);
  v.on('animatefinished',function(){VPT=performance.now();});
  // tuval/görüş alanı uyuşmazlığını düzelt; true dönerse yeniden çizim gerekir
  function fit(r){var c=r&&r.getCanvas&&r.getCanvas();if(!c||document.querySelector('.pnlm-world'))return false;var d=window.devicePixelRatio||1,bad=false;
    if(c.clientWidth&&(Math.abs(c.width-c.clientWidth*d)>2||Math.abs(c.height-c.clientHeight*d)>2)){r.resize();bad=true;}
    var g=r.__gl||(r.__gl=c.getContext('webgl')||c.getContext('experimental-webgl'));
    if(g){var q=g.getParameter(g.VIEWPORT);if(q[0]||q[1]||q[2]!==g.drawingBufferWidth||q[3]!==g.drawingBufferHeight){g.viewport(0,0,g.drawingBufferWidth,g.drawingBufferHeight);bad=true;}}
    return bad;}
  // her karede çizmeden hemen önce düzelt: boştayken karo yüklenip yeniden çizilse de görüntü kaymaz (döngü gerekmez)
  function patch(){try{var r=v.getRenderer();if(!r||r.__vp)return r;var o=r.render;r.__vp=1;
    // WebGL bağlamı düşerse (Mac'te ekran kartı geçişinde olabilir) sayfayı aynı bakış noktası ve açıyla yeniden aç
    var cv=r.getCanvas();cv.addEventListener('webglcontextlost',function(e){e.preventDefault();rep('baglam');},false);
    cv.addEventListener('webglcontextrestored',function(){try{sessionStorage.setItem('vzBak',JSON.stringify([cur+1,v.getPitch(),v.getYaw(),v.getHfov(),night]));}catch(e){}location.reload();},false);
    r.render=function(){try{if(fit(r))rep('cizim');}catch(e){}return o.apply(r,arguments);};return r;}catch(e){}}
  // bekçi: 2 sn'de bir (sekme görünürken) tuvali denetler; boştayken bozulursa düzeltip yeniden çizer.
  // Düzeltme olursa Analytics'e bir kez "vaziyet_duzeltme" olayı gider: gerçek ziyaretçilerde olup olmadığını görürüz.
  var REP=false;
  function rep(t){if(REP)return;REP=true;try{window.gtag&&gtag('event','vaziyet_duzeltme',{tur:t,ua:navigator.userAgent.slice(0,90)});}catch(e){}window.__vpDuzeltme=(window.__vpDuzeltme||0)+1;}
  // başka pencereye geçip dönünce, sekme değişince, sayfa geri gelince: tuvali baştan kurup yeniden çiz
  // (Safari/Firefox pencere odağı değişince eski çizimi büyütülmüş gösterebiliyor)
  var TZ=0;
  function tazele(){clearTimeout(TZ);try{var r=patch();fit(r);v.resize();}catch(e){}wake();TZ=setTimeout(function(){try{v.resize();}catch(e){}},350);}
  // Mac'te (Retina) pencere arkaya düşüp geri gelince tarayıcı WebGL tuvalini yarım çözünürlükte bırakıp
  // görüntüyü 2 kat büyütülmüş, sol alta kaymış gösterebiliyor; bu hâl JavaScript'ten okunamıyor.
  // Bu yüzden pencereye/sekmeye dönülünce çizim belleğini baştan ayırıp yeniden çiz.
  var GIT=0;
  function arkada(){GIT=Date.now();}
  function yenidenKur(){
    if(!GIT||Date.now()-GIT<250)return;GIT=0;
    // tuvali önce 1x1'e küçült (tarayıcı eski çizim belleğini atar), bir kare sonra tam boyutta yeniden ayır ve çiz
    try{var r=v.getRenderer(),c=r&&r.getCanvas();if(!c)return tazele();c.width=c.height=1;window.__vzKurulum=(window.__vzKurulum||0)+1;
      requestAnimationFrame(function(){requestAnimationFrame(tazele);});}catch(e){tazele();}
  }
  addEventListener('blur',function(){arkada();tazele();});
  addEventListener('focus',function(){tazele();yenidenKur();});
  addEventListener('pageshow',function(e){if(e.persisted){GIT=1;yenidenKur();}else tazele();});
  document.addEventListener('visibilitychange',function(){if(document.hidden)arkada();else{tazele();yenidenKur();}});
  setInterval(function(){if(document.hidden)return;try{var r=patch();if(r&&fit(r)){rep('bekci');v.resize();}}catch(e){}},2000);
  function vpFix(){patch();if(performance.now()-VPT>1500){VPON=false;return;}try{if(fit(v.getRenderer()))v.resize();}catch(e){}
    requestAnimationFrame(vpFix);}
  // ekran çözünürlüğü değişirse (pencere Retina/harici ekran arasında taşınınca, tarayıcı yakınlaştırması) tuvali yenile
  (function dpr(){try{var m=matchMedia('(resolution: '+(window.devicePixelRatio||1)+'dppx)'),f=function(){m.removeEventListener('change',f);try{v.resize();}catch(e){}wake();dpr();};m.addEventListener('change',f);}catch(e){}})();
  wake();
  v.on('scenechange',wake);v.on('load',wake);
  v.on('scenechange',function(){setTimeout(function(){try{v.resize();}catch(e){}},50);});
  v.on('load',function(){try{v.resize();}catch(e){}});
  // diğer sayfalardan vaziyet-plani.html#etap-N ile gelinirse: o etabın göründüğü bakış noktasını açıp kartını göster
  var HQ=0;
  function openHash(){
    var m=/etap-(\d+)/.exec(location.hash);if(!m)return;var n=+m[1],t0=Date.now();clearTimeout(HQ);
    (function tryOpen(){
      if(!E[n]||!v.isLoaded()){if(Date.now()-t0<15000)HQ=setTimeout(tryOpen,200);return;}
      var best=null;for(var d=0;d<SC.length&&!best;d++){var i=(cur+d)%SC.length,ps=DZ?DZ.sc[i].pins:SC[i].e;
        ps.forEach(function(q){if(!best&&+q[2]===n)best=[i,q[0],q[1]];});}
      if(!best)return open(n);
      if(best[0]===cur)return open(n,best[1],best[2]);
      var once=function(){v.off('load',once);setTimeout(function(){open(n,best[1],best[2]);},300);};
      v.on('load',once);v.loadScene(sid(best[0]+1));
    })();
  }
  addEventListener('hashchange',openHash);setTimeout(openHash,600);
  function proj(yaw,pitch){
    var W=innerWidth,H=innerHeight,r=Math.PI/180,cp=v.getPitch()*r,cy=v.getYaw()*r,hf=v.getHfov()*r;
    var ps=Math.sin(pitch*r),pc=Math.cos(pitch*r),yc=Math.cos(-yaw*r+cy),ys=Math.sin(-yaw*r+cy);
    var z=ps*Math.sin(cp)+pc*yc*Math.cos(cp);if(z<=0)return null;var t=Math.tan(hf/2);
    return [W/2-W/t*ys*pc/z/2,H/2-W/t*(ps*Math.cos(cp)-pc*yc*Math.sin(cp))/z/2];
  }
  // seçilen etabın blokları parlasın
  // efekt: ?fx=1 spot (çevre kararır, çizgi kendini çizer), 2 tarama (ışık bandı yukarı süzülür), 3 yükselen (renk alttan dolar, kenarda akan ışık)
  var FX=+((location.search.match(/[?&]fx=(\d)/)||[])[1])||3,T0=0,KEY='',NS='http://www.w3.org/2000/svg',EL=null;
  function hl(n){HL=n;BB=null;T0=performance.now();KEY='';if(svg)svg.innerHTML='';}
  function mk(t,a,par){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(par)par.appendChild(e);return e;}
  function hlBuild(n,c){
    svg.innerHTML='';var d=mk('defs',{},svg);
    var f=mk('filter',{id:'hlg',x:'-20%',y:'-20%',width:'140%',height:'140%'},d);mk('feGaussianBlur',{stdDeviation:'9'},f);
    var g=mk('linearGradient',{id:'hlb',x1:0,y1:0,x2:0,y2:1},d);
    [[0,0],[.5,.75],[1,0]].forEach(function(s){mk('stop',{offset:s[0],'stop-color':'#fff','stop-opacity':s[1]},g);});
    var cp=mk('clipPath',{id:'hlc'},d);
    EL={dim:mk('path',{fill:'#060a14','fill-rule':'nonzero',opacity:0},svg),cp:[],gl:[],ln:[],co:[]};
    var inn=mk('g',{'clip-path':'url(#hlc)'},svg);
    EL.fill=mk('rect',{x:0,width:'100%',fill:c,opacity:0},inn);EL.band=mk('rect',{x:0,width:'100%',fill:'url(#hlb)',opacity:0},inn);
    var gg=mk('g',{filter:'url(#hlg)'},svg);
    for(var i=0;i<n;i++){EL.cp.push(mk('polygon',{},cp));
      EL.gl.push(mk('polygon',{fill:'none',stroke:c,'stroke-width':14,'stroke-linejoin':'round'},gg));
      EL.ln.push(mk('polygon',{fill:'none',stroke:c,'stroke-width':3.5,'stroke-linejoin':'round'},svg));
      EL.co.push(mk('polygon',{fill:'none',stroke:'#fff','stroke-width':1.2,'stroke-linejoin':'round',opacity:0},svg));}
  }
  // kart açıkken çalışır; giriş animasyonundan (≈4,7 sn) sonra yalnız görüntü değişince yeniden çizer
  var LOOP=false,CAM='',TMAX=4.712;
  function loopOn(){if(!LOOP){LOOP=true;CAM='';requestAnimationFrame(loop);}}
  function loop(){
    if(!card.classList.contains('on')){LOOP=false;return;}
    var cam=v.getYaw().toFixed(3)+'/'+v.getPitch().toFixed(3)+'/'+v.getHfov().toFixed(3)+'/'+innerWidth+'/'+innerHeight+'/'+HL+'/'+cur+'/'+(DZ?1:0)+'/'+card.offsetHeight,
      live=(performance.now()-T0)/1000<TMAX+.1;
    if(!live&&cam===CAM&&(!HL||!DZ||svg&&svg.isConnected)){requestAnimationFrame(loop);return;}
    CAM=cam;
    if(HL&&DZ){
      if(!svg||!svg.isConnected){var rc=document.querySelector('#pano .pnlm-render-container');if(rc){svg=mk('svg',{'class':'hlsvg'});rc.insertBefore(svg,rc.querySelector('canvas').nextSibling);KEY='';}}
      if(svg){var c=E[HL]?ST[E[HL].st][1]:'#FB5160',PS=[];
        (DZ.sc[cur].shapes||[]).forEach(function(sh){if(+sh.etap!==HL)return;var P=sh.p.map(function(q){return proj(q[0],q[1]);});if(!P.some(function(q){return !q;}))PS.push(P);});
        var k=HL+'/'+cur+'/'+PS.length;if(k!==KEY){KEY=k;hlBuild(PS.length,c);}
        var t=Math.min(TMAX,(performance.now()-T0)/1000),e=Math.min(1,t/.9),ez=1-Math.pow(1-e,3),y0=1e9,y1=-1e9,pu=.5+.5*Math.sin(t*3);
        PS.forEach(function(P,i){var s=P.map(function(q){if(q[1]<y0)y0=q[1];if(q[1]>y1)y1=q[1];return q[0].toFixed(1)+','+q[1].toFixed(1);}).join(' ');
          EL.cp[i].setAttribute('points',s);EL.gl[i].setAttribute('points',s);EL.ln[i].setAttribute('points',s);EL.co[i].setAttribute('points',s);
          var L=0;for(var j=0;j<P.length;j++){var a=P[j],b=P[(j+1)%P.length];L+=Math.hypot(b[0]-a[0],b[1]-a[1]);}
          if(FX===1){[EL.ln[i],EL.co[i]].forEach(function(o){o.setAttribute('stroke-dasharray',L+' '+L);o.setAttribute('stroke-dashoffset',(L*(1-ez)).toFixed(1));});EL.co[i].setAttribute('opacity',(.55+.35*pu).toFixed(3));}
          else if(FX===3){EL.ln[i].setAttribute('stroke-dasharray','22 12');EL.ln[i].setAttribute('stroke-dashoffset',(-t*70).toFixed(1));}
          EL.gl[i].setAttribute('opacity',(ez*(FX!==2?.6+.4*pu:.35+.35*pu)).toFixed(3));if(FX===3)EL.co[i].setAttribute('opacity',(ez*(.45+.35*pu)).toFixed(3));});
        BB=PS.length?[1e9,y0,-1e9,y1]:null;PS.forEach(function(P){P.forEach(function(q){if(q[0]<BB[0])BB[0]=q[0];if(q[0]>BB[2])BB[2]=q[0];});});
        var W=innerWidth,H=innerHeight,dd='M0 0H'+W+'V'+H+'H0Z';
        PS.forEach(function(P){var A=0;for(var j=0;j<P.length;j++){var a=P[j],b=P[(j+1)%P.length];A+=a[0]*b[1]-b[0]*a[1];}
          var Q=A>0?P.slice().reverse():P;dd+='M'+Q.map(function(q){return q[0].toFixed(1)+' '+q[1].toFixed(1);}).join('L')+'Z';});
        EL.dim.setAttribute('d',dd);
        var h=Math.max(1,y1-y0),dk=PS.length?1:0;
        if(FX===1){EL.dim.setAttribute('opacity',.62*ez*dk);EL.fill.setAttribute('y',y0);EL.fill.setAttribute('height',h);EL.fill.setAttribute('opacity',ez*(.3+.2*pu));}
        else if(FX===2){EL.dim.setAttribute('opacity',.4*ez*dk);EL.fill.setAttribute('y',y0);EL.fill.setAttribute('height',h);EL.fill.setAttribute('opacity',.22*ez);
          var bh=Math.max(60,h*.45),ph=(t%2.4)/2.4;EL.band.setAttribute('height',bh);EL.band.setAttribute('y',(y1-(h+bh)*ph).toFixed(1));EL.band.setAttribute('opacity',ez);}
        else{var r=1-Math.pow(1-Math.min(1,t/1.3),3);EL.dim.setAttribute('opacity',.62*ez*dk);EL.fill.setAttribute('y',(y1-h*r).toFixed(1));EL.fill.setAttribute('height',(h*r+2).toFixed(1));EL.fill.setAttribute('opacity',(.32+(r>=1?.16*pu:0)).toFixed(3));}
      }
    }
    place();
    requestAnimationFrame(loop);
  }
  // kartı etabın yanına yerleştir: geniş ekranda sağına (yer yoksa soluna), telefonda altına (yer yoksa üstüne)
  var BB=null;
  function place(){
    var W=innerWidth,H=innerHeight,cw=card.offsetWidth,ch=card.offsetHeight,g=14,b=null;
    if(HL&&BB&&BB[0]<BB[2])b=BB;else if(SELYP){var q=proj(SELYP[0],SELYP[1]);if(q)b=[q[0]-16,q[1]-16,q[0]+16,q[1]+16];}
    var x,y,ox;
    if(!b){x=(W-cw)/2;y=H-ch-g;ox='50%';}
    else if(W>=768){x=b[2]+g;ox='0';if(x+cw>W-g){x=b[0]-g-cw;ox='100%';}y=(b[1]+b[3])/2-ch/2;}
    else{x=(b[0]+b[2])/2-cw/2;y=b[3]+g;ox='50%';if(y+ch>H-g)y=b[1]-g-ch;}
    x=Math.max(g,Math.min(W-cw-g,x));y=Math.max(70,Math.min(H-ch-g,y));
    card.style.left=x.toFixed(0)+'px';card.style.top=y.toFixed(0)+'px';card.style.setProperty('--ox',ox);
  }
  addEventListener('keydown',function(e){if(e.key==='Escape')close();});
})();
